[project]
name = "hitdesigndmx"
version = "0.1.0"
description = "Design hitnotedmx MIDI clips and convert legacy Ableton lighting clips into the hitnotedmx note vocabulary"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hitdmxconvert = "hitdesigndmx.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hitdesigndmx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
